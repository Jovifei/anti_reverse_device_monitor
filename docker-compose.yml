services:
  app:
    build: .
    ports:
      - "3000:3000"
    env_file:
      - .env.docker
    environment:
      APP_DATABASE_URL: file:../data/device-monitor.db
    volumes:
      - app-data:/app/data
      - app-config:/app/config
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/live').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 8s
      retries: 3
      start_period: 40s

  # Production sync: docker compose --profile sync run --rm sync
  sync:
    profiles: ["sync"]
    build: .
    env_file:
      - .env.docker
    environment:
      APP_DATABASE_URL: file:../data/device-monitor.db
      SOURCE_DB_ENABLED: "true"
      SOURCE_DB_TYPE: mongodb
    volumes:
      - app-data:/app/data
      - app-config:/app/config
    command: ["npm", "run", "source:worker"]

volumes:
  app-data:
  app-config:
